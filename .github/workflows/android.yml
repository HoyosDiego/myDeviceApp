name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK Manually
        run: |
          # 1. Decodificar la keystore desde el secreto
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # 2. Encontrar el APK generado
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          
          # 3. Firmar usando apksigner (viene en el SDK de Android)
          # Usamos la versión 34 o 35 que ya está instalada en el runner
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out MyDeviceApp-Signed.apk \
            $APK_PATH

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDeviceApp-Final
          path: MyDeviceApp-Signed.apk