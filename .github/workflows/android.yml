name: Build Android AAB (Play Store)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Build Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign AAB
        run: |
          # 1. Creamos el archivo de la llave desde el secreto
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          
          # 2. Identificamos la ruta del bundle generado
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          # 3. Firmamos el AAB usando jarsigner (estándar para bundles)
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            $AAB_PATH "${{ secrets.KEY_ALIAS }}"
          
          # 4. Lo movemos a la raíz con un nombre claro para descargar
          cp $AAB_PATH MyDeviceApp-Production.aab

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDeviceApp-Bundle-Final
          path: MyDeviceApp-Production.aab